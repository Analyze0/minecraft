<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Ticklecraft Beta</title>
  <link rel="icon" type="image/png" href="assets/website/favicon.png">
  <link rel="stylesheet" href="/test.css" type="text/css"/>
</head>

<body>
  <div class="body" id="body">
    <div class="head" id="head">
      <div id="head-top" class="head-side head-top"></div>
      <div id="head-bottom" class="head-side head-bottom"></div>
      <div id="head-left" class="head-side head-left"></div>
      <div id="head-moreRight" class="head-side head-moreRight"></div>
      <div id="head-right" class="head-side head-front"></div>
      <div id="head-back" class="head-side head-back"></div>
    </div>

    <div class="torso" id="torso">
      <div id="torso-top" class="torso-side torso-top"></div>
      <div id="torso-bottom" class="torso-side torso-bottom"></div>
      <div id="torso-left" class="torso-side torso-left"></div>
      <div id="torso-moreRight" class="torso-side torso-moreRight"></div>
      <div id="torso-right" class="torso-side torso-front"></div>
      <div id="torso-back" class="torso-side torso-back"></div>
    </div>

    <div class="leg-left" id="leg-left">
      <div id="leg-left-top" class="leg-left-side leg-left-top"></div>
      <div id="leg-left-bottom" class="leg-left-side leg-left-bottom"></div>
      <div id="leg-left-left" class="leg-left-side leg-left-left"></div>
      <div id="leg-left-moreRight" class="leg-left-side leg-left-moreRight"></div>
      <div id="leg-left-right" class="leg-left-side leg-left-front"></div>
      <div id="leg-left-back" class="leg-left-side leg-left-back"></div>
    </div>

    <div class="arm-left" id="arm-left">
      <div id="arm-left-top" class="arm-left-side arm-left-top"></div>
      <div id="arm-left-bottom" class="arm-left-side arm-left-bottom"></div>
      <div id="arm-left-left" class="arm-left-side arm-left-left"></div>
      <div id="arm-left-moreRight" class="arm-left-side arm-left-moreRight"></div>
      <div id="arm-left-right" class="arm-left-side arm-left-front"></div>
      <div id="arm-left-back" class="arm-left-side arm-left-back"></div>
    </div>

    <div class="arm-right" id="arm-right">
      <div id="arm-right-top" class="arm-right-side arm-right-top"></div>
      <div id="arm-right-bottom" class="arm-right-side arm-right-bottom"></div>
      <div id="arm-right-left" class="arm-right-side arm-right-left"></div>
      <div id="arm-right-moreRight" class="arm-right-side arm-right-moreRight"></div>
      <div id="arm-right-right" class="arm-right-side arm-right-front"></div>
      <div id="arm-right-back" class="arm-right-side arm-right-back"></div>
    </div>
  </div>
  <script src="/test.js"></script>
</body>

</html>
